  <footer class="footer"><span>课程安排来源：2026-2027 学年第 1 学期课表 PDF</span><span>当前视图：周视图 / 1-12 节</span></footer>
</main>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-panel"><button class="close" id="close" aria-label="关闭详情">×</button><div class="detail-kicker">COURSE DETAIL</div><h2 class="detail-title" id="detail-title">课程详情</h2><div id="detail-body"></div></div></aside><div class="toast" id="toast">已切换到第 1 周</div>
<script>
const courses=[
{d:1,p:[1,2],n:'Linux编程',w:'1-18周',weeks:[1,18],room:'教4-405',teacher:'赵广振',type:'限选',credit:'2',tone:'blue'},
{d:1,p:[6,7],n:'Web技术（双语）',w:'1-18周',weeks:[1,18],room:'教4-102',teacher:'韩京宇',type:'必修',credit:'2.5',tone:'red'},
{d:1,p:[8,9],n:'数据库系统原理',w:'1-18周',weeks:[1,18],room:'教4-312',teacher:'顾啸林 / 彭瑶',type:'必修',credit:'3',tone:'red'},
{d:2,p:[6,7],n:'毛泽东思想和中国特色社会主义理论体系概论',w:'1-8周',weeks:[1,8],room:'教3-213',teacher:'赖风',type:'必修',credit:'2.0',tone:'yellow'},
{d:2,p:[8,9],n:'Windows应用开发（双语）',w:'1-18周',weeks:[1,18],room:'教4-208',teacher:'成小惠',type:'限选',credit:'2',tone:'blue'},
{d:3,p:[1,2],n:'软件工程原理与实践',w:'2-18周（双）',weeks:[2,18],parity:'even',room:'教3-412',teacher:'毛燕琴',type:'必修',credit:'3',tone:'red'},
{d:3,p:[6,7],n:'习近平新时代中国特色社会主义思想概论',w:'9-18周',weeks:[9,18],room:'教3-213',teacher:'赖风',type:'必修',credit:'2.0',tone:'yellow'},
{d:3,p:[8,9],n:'计算机组成原理（混合式）',w:'1-18周',weeks:[1,18],room:'教4-110',teacher:'陈燕俐 / 李维维',type:'必修',credit:'3.5',tone:'red'},
{d:4,p:[1,2],n:'Web技术（双语）',w:'2-18周（双）',weeks:[2,18],parity:'even',room:'教4-309',teacher:'韩京宇',type:'必修',credit:'2.5',tone:'red'},
{d:4,p:[3,4],n:'数据库系统原理',w:'1-17周（单）',weeks:[1,17],parity:'odd',room:'教4-309',teacher:'顾啸林 / 彭瑶',type:'必修',credit:'3',tone:'red'},
{d:4,p:[6,7],n:'网络技术与应用（混合式）',w:'1-18周',weeks:[1,18],room:'教3-412',teacher:'张淳',type:'必修',credit:'2',tone:'red'},
{d:4,p:[8,9],n:'就业指导',w:'1-4周',weeks:[1,4],room:'教4-101',teacher:'尹莉',type:'必修',credit:'0.5',tone:'green'},
{d:5,p:[3,4],n:'计算机组成原理（混合式）',w:'1-18周',weeks:[1,18],room:'教4-403',teacher:'陈燕俐 / 李维维',type:'必修',credit:'3.5',tone:'red'},
{d:5,p:[6,7],n:'软件工程原理与实践',w:'1-18周',weeks:[1,18],room:'教2-305',teacher:'毛燕琴',type:'必修',credit:'3',tone:'red'},
{d:5,p:[8,9],n:'毛泽东思想和中国特色社会主义理论体系概论',w:'1-8周',weeks:[1,8],room:'教3-213',teacher:'赖风',type:'必修',credit:'2.0',tone:'yellow'},
{d:5,p:[8,9],n:'习近平新时代中国特色社会主义思想概论',w:'9-18周',weeks:[9,18],room:'教3-213',teacher:'赖风',type:'必修',credit:'2.0',tone:'yellow'}];
let selectedWeek=1, selectedFilter='all', selectedDay=1;
const semesterStart=new Date(2026,7,31);
function currentContext(){const now=new Date();const dayOffset=Math.floor((now-semesterStart)/86400000);return {week:Math.max(1,Math.min(18,Math.floor(dayOffset/7)+1)),day:now.getDay()===0?7:now.getDay()}}
const periodTimes=[['08:00','08:45'],['08:50','09:35'],['09:50','10:35'],['10:40','11:25'],['11:30','12:15'],['13:45','14:30'],['14:35','15:20'],['15:35','16:20'],['16:25','17:10'],['18:30','19:15'],['19:25','20:10'],['20:20','21:05']];
function toMinutes(v){const [h,m]=v.split(':').map(Number);return h*60+m}
function currentLesson(){const now=new Date(), ctx=currentContext(), mins=now.getHours()*60+now.getMinutes(), period=periodTimes.findIndex(([a,b])=>mins>=toMinutes(a)&&mins<=toMinutes(b))+1;const todayCourses=courses.filter(c=>c.d===ctx.day&&ctx.week>=c.weeks[0]&&ctx.week<=c.weeks[1]&&!(c.parity==='odd'&&ctx.week%2===0)&&!(c.parity==='even'&&ctx.week%2!==0));if(!period)return {kind:'break',ctx};const lesson=todayCourses.find(c=>c.p[0]<=period&&c.p[1]>=period);return {kind:lesson?'lesson':'free',ctx,period,lesson}}
function updateCurrentStatus(){const s=document.getElementById('current-status'),x=currentLesson(),day='一二三四五六日'[x.ctx.day-1];if(x.kind==='lesson')s.innerHTML=`正在上课：${x.lesson.n} <small>· 星期${day} · 第 ${x.lesson.p[0]}-${x.lesson.p[1]} 节 · ${x.lesson.room}</small>`;else if(x.kind==='break')s.innerHTML=`当前为课间或休息时间 <small>· 第 ${x.ctx.week} 周 · 星期${day}</small>`;else s.innerHTML=`当前没有课程 <small>· 第 ${x.ctx.week} 周 · 星期${day}</small>`}
const liveContext=currentContext();selectedWeek=liveContext.week;selectedDay=liveContext.day;
const body=document.querySelector('#body-grid');
for(let p=1;p<=12;p++){const part=p<=5?'上午':p<=9?'下午':'晚上';const n=document.createElement('div');n.className='period-no';n.textContent=p;n.dataset.part=p===1||p===6||p===10?part:'';n.style.gridRow=p;n.style.gridColumn=1;body.appendChild(n);for(let d=1;d<=5;d++){const cell=document.createElement('div');cell.className='day-cell';cell.dataset.day=d;cell.style.gridRow=p;cell.style.gridColumn=d+1;body.appendChild(cell)}}
function visible(c){if(selectedWeek<c.weeks[0]||selectedWeek>c.weeks[1])return false;if(c.parity==='odd'&&selectedWeek%2===0&&selectedFilter==='all')return false;if(c.parity==='even'&&selectedWeek%2!==0&&selectedFilter==='all')return false;if(selectedFilter==='odd'&&c.parity==='even')return false;if(selectedFilter==='even'&&c.parity==='odd')return false;return true}
const compactNames={'Web技术（双语）':'Web技术','数据库系统原理':'数据库','毛泽东思想和中国特色社会主义理论体系概论':'毛概','Windows应用开发（双语）':'Windows开发','习近平新时代中国特色社会主义思想概论':'习概','计算机组成原理（混合式）':'计算机组成','网络技术与应用（混合式）':'网络技术','软件工程原理与实践':'软件工程'};
function card(c){const el=document.createElement('button');el.className='class-card';el.dataset.day=c.d;el.dataset.room=c.room;el.dataset.tone=c.tone;el.classList.toggle('selected-day',c.d===selectedDay);el.style.setProperty('grid-column',c.d+1,'important');el.style.gridRow=`${c.p[0]} / ${c.p[1]+1}`;el.style.margin='5px';el.style.animationDelay=(c.d*35)+'ms';el.innerHTML=`<div><div class="card-top"><h3><span class="full-title">${c.n}</span><span class="compact-title">${compactNames[c.n]||c.n}</span></h3><span class="credit">${c.credit} 学分</span></div><div class="card-meta" data-room="${c.room}">${c.w} · ${c.room}<br>${c.teacher}</div></div><div class="card-foot"><span>${c.type}</span><strong>${c.p[0]}-${c.p[1]} 节</strong></div>`;el.addEventListener('click',()=>openDetail(c));return el}
function updateWeekHeaders(){const heads=[...document.querySelectorAll('.schedule>.head')];heads.slice(1).forEach((h,i)=>{const date=new Date(semesterStart);date.setDate(date.getDate()+(selectedWeek-1)*7+i);const names=['一','二','三','四','五','六','日'],months=date.getMonth()+1,day=date.getDate();h.innerHTML=`星期${names[i]} <small>${months}/${day}</small>`})}
function render(){body.querySelectorAll('.class-card').forEach(s=>s.remove());body.querySelectorAll('.day-cell').forEach(c=>c.classList.toggle('active',Number(c.dataset.day)===selectedDay));document.querySelectorAll('.day-tab').forEach(b=>b.classList.toggle('today',Number(b.dataset.day)===liveContext.day));courses.forEach(c=>{if(visible(c))body.appendChild(card(c))});updateWeekHeaders();document.getElementById('week-label').textContent=`第${selectedWeek}周${selectedWeek===liveContext.week?' · 当前':''}`;document.getElementById('week').value=selectedWeek;document.getElementById('toast').textContent=`已切换到第 ${selectedWeek} 周`;updateCurrentStatus()}
function setWeek(v){selectedWeek=Math.max(1,Math.min(18,Number(v)));render();pulseToast()}
function pulseToast(){const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1200)}
function openDetail(c){document.getElementById('detail-title').textContent=c.n;document.getElementById('detail-body').innerHTML=`<div class="detail-row"><span>上课时间</span><strong>星期${'一二三四五'[c.d-1]} · 第 ${c.p[0]}-${c.p[1]} 节</strong></div><div class="detail-row"><span>上课周次</span><strong>${c.w}</strong></div><div class="detail-row"><span>校区 / 教室</span><strong>仙林 · ${c.room}</strong></div><div class="detail-row"><span>任课教师</span><strong>${c.teacher}</strong></div><div class="detail-row"><span>课程性质</span><strong>${c.type}</strong></div><div class="detail-row"><span>学分</span><strong>${c.credit}</strong></div>`;const d=document.getElementById('drawer');d.classList.add('open');d.setAttribute('aria-hidden','false')}
function closeDetail(){const d=document.getElementById('drawer');d.classList.remove('open');d.setAttribute('aria-hidden','true')}
document.getElementById('week').addEventListener('input',e=>setWeek(e.target.value));document.getElementById('prev').addEventListener('click',()=>setWeek(selectedWeek-1));document.getElementById('next').addEventListener('click',()=>setWeek(selectedWeek+1));document.getElementById('close').addEventListener('click',closeDetail);document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDetail()});document.querySelectorAll('.day-tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.day-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedDay=Number(b.dataset.day);render()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();if(e.key==='ArrowLeft')setWeek(selectedWeek-1);if(e.key==='ArrowRight')setWeek(selectedWeek+1)});document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedFilter=b.dataset.filter;if(selectedFilter==='current'){selectedWeek=liveContext.week;selectedDay=liveContext.day;selectedFilter='all';document.querySelector('[data-filter="all"]').classList.add('active');b.classList.remove('active');document.querySelectorAll('.day-tab').forEach(x=>x.classList.toggle('active',Number(x.dataset.day)===selectedDay))}render();pulseToast()}));render();setInterval(updateCurrentStatus,30000);
</script>
